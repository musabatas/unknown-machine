[project]
name = "unknown-machine"
version = "0.1.0"
description = "RL environment for the AfterQuery Break the Agent challenge: bring an orphaned legacy system back online"
authors = [
    {name = "Unknown Machine team"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp (==2.3.0)"
]

[tool.poetry]
packages = [{include = "unknown_machine", from = "src"}]

# The post-training experiment (training/). Apple Silicon only: `poetry install --with training`.
[tool.poetry.group.training]
optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated copies of src/ and scripts/task_template; lint the source, not the output.
extend-exclude = ["tasks/level-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "ruff (>=0.17.5,<0.18.0)"
]
training = [
    "mlx-lm (>=0.32.2,<0.33.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
