services:
  # Harbor's own template builds `main` from environment/Dockerfile.
  main:
    depends_on:
      machine:
        condition: service_healthy

  machine:
    build:
      context: ./machine
    environment:
      # These values exist only in this container. They are literals on purpose:
      # a ${VAR} here or in task.toml makes `harbor run` stop for confirmation.
      SEED: "3"
      LEVEL: "1"
      THEME: "legacy"
      RESULT_KEY: 01cf42507a389a4f978ee831e2d44ffc6e819ae62209c7c2
    expose:
      - "8000"
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8001/health", timeout=2)
      interval: 2s
      timeout: 5s
      retries: 30
