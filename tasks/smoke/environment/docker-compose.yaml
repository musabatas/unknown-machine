services:
  # Harbor's own template builds `main` from environment/Dockerfile.
  main:
    depends_on:
      machine:
        condition: service_healthy

  machine:
    build:
      context: ./machine
    environment:
      # Signs the result the verifier reads. Never set in `main`.
      # A literal on purpose: a ${VAR} here or in task.toml makes `harbor run`
      # stop for an interactive confirmation.
      RESULT_KEY: smoke-task-result-key
    expose:
      - "8000"
      - "8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8001/health", timeout=2)
      interval: 2s
      timeout: 5s
      retries: 30
