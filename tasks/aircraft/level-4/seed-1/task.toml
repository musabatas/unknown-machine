schema_version = "1.4"
artifacts = []

[task]
name = "unknown-machine/aircraft-level-4-seed-1"
version = "1.0.0"
description = "Bring a captured aircraft of an unknown type to take-off without damaging it"
keywords = ["exploration", "operations", "irreversible-actions", "budgeted-information"]
[[task.authors]]
name = "Unknown Machine team"

[metadata]
seed = 1
level = 4
theme = "aircraft"

[verifier]
timeout_sec = 120.0
# Shared: tests run in `main` while the sidecar that holds the score is still up.
# In separate mode the agent environment is torn down before the verifier starts.
environment_mode = "shared"
collect = []

[verifier.env]
# Passed only to the verifier command, never to the agent.
RESULT_KEY = "94c23a39f7f6233976e207a9b873ff893b4027c3dfaeb8cb"
MACHINE_CONTROL_URL = "http://machine:8001"

[agent]
timeout_sec = 3600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"

[[environment.mcp_servers]]
name = "machine"
transport = "streamable-http"
url = "http://machine:8000/mcp"

[environment.env]

[solution.env]
